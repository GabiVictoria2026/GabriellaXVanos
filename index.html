/* =========================================================
   BASE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #020711;
    color: #eeeeec;
}


/* =========================================================
   CAPA
========================================================= */

.capa {

    position: relative;

    width: 100%;
    height: 100svh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    background:

        radial-gradient(
            ellipse at 50% 42%,
            rgba(34, 51, 76, .40) 0%,
            rgba(14, 27, 46, .25) 30%,
            rgba(5, 12, 22, .62) 68%,
            #020711 100%
        ),

        linear-gradient(
            145deg,
            #07111f,
            #020711 50%,
            #06101d
        );

    perspective: 1200px;
}


/* textura suave */

.capa::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .13;

    background:

        radial-gradient(
            ellipse at 25% 20%,
            rgba(255,255,255,.08),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 75% 80%,
            rgba(255,255,255,.05),
            transparent 42%
        );

    mix-blend-mode: screen;
}


/* textura muito discreta */

.capa::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .045;

    background-image:

        radial-gradient(
            rgba(255,255,255,.7) .3px,
            transparent .5px
        );

    background-size: 5px 5px;
}


/* =========================================================
   FOTO DO TROPICAL
   INTEGRADA AO FUNDO
========================================================= */

.local-festa {

    position: absolute;

    z-index: 1;

    width: min(560px, 82vw);

    right: -9%;
    bottom: -2%;

    opacity: .075;

    pointer-events: none;

    mix-blend-mode: screen;

    transition:
        opacity .8s ease,
        transform 1.2s cubic-bezier(.22,.61,.36,1);
}


/* imagem */

.local-festa img {

    display: block;

    width: 100%;
    height: auto;

    filter:
        grayscale(1)
        brightness(1.55)
        contrast(.48);

    opacity: .72;
}


/* =========================================================
   DEGRADÊ SOBRE A FOTO
========================================================= */

.local-festa::after {

    content: "";

    position: absolute;

    inset: -5%;

    pointer-events: none;

    background:

        linear-gradient(
            to left,
            transparent 30%,
            rgba(2,7,17,.35) 58%,
            rgba(2,7,17,.80) 82%,
            #020711 100%
        ),

        linear-gradient(
            to top,
            #020711 0%,
            rgba(2,7,17,.75) 17%,
            transparent 45%
        ),

        radial-gradient(
            ellipse at center,
            transparent 18%,
            rgba(2,7,17,.30) 58%,
            #020711 92%
        );
}

   BORDAS LATERAIS
========================================================= */

    top: 12%;

            rgba(225,226,225,.08) 90%,

            transparent 100%
