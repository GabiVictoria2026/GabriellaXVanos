<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #030811;
    color: #eeeeec;
}


/* =========================
   CAPA
========================= */

.capa {
    position: relative;

    width: 100%;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    cursor: pointer;

    background:
        radial-gradient(
            ellipse at 50% 43%,
            rgba(37, 54, 79, .38) 0%,
            rgba(13, 25, 43, .25) 28%,
            rgba(5, 12, 22, .45) 62%,
            #02070f 100%
        ),
        linear-gradient(
            135deg,
            #07111f,
            #020711 48%,
            #07101c
        );

    perspective: 1200px;
}


/* =========================
   TEXTURA DE FUNDO
========================= */

.capa::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .16;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,.08) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,.055) 0 1px,
            transparent 1.5px
        );

    background-size:
        7px 7px,
        11px 11px;

    mix-blend-mode: screen;
}


/* textura tipo papel/veludo */

.capa::before {
    filter: contrast(115%);
}


/* =========================
   ILUSTRAÇÃO DO LOCAL
========================= */

.local-festa {
    position: absolute;

    z-index: 1;

    width: min(510px, 72vw);

    right: -4%;
    bottom: 2%;

    opacity: .14;

    filter:
        grayscale(1)
        brightness(1.65)
        contrast(.72);

    mix-blend-mode: screen;

    pointer-events: none;

    transition:
        transform 1.2s cubic-bezier(.22,.61,.36,1),
        opacity .8s ease;
}


/* leve máscara para integrar ao fundo */

.local-festa::after {
    content: "";
}


/* =========================
   MOLDURA
========================= */

.moldura {
    position: absolute;

    inset: 22px;

    border: 1px solid rgba(205,207,208,.60);

    z-index: 3;

    pointer-events: none;

    transition:
        opacity .9s ease,
        transform 1s cubic-bezier(.22,.61,.36,1);
}


/* =========================
   LINHAS
========================= */

.linha-horizontal {
    position: absolute;

    left: 7%;
    right: 7%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(220,220,218,.72),
            transparent
        );

    opacity: .65;

    pointer-events: none;

    z-index: 3;

    transition:
        opacity .8s ease,
        transform .9s ease;
}

.linha-superior {
    top: 22px;
}

.linha-inferior {
    bottom: 22px;
}


/* =========================
   ORNAMENTOS
========================= */

.ornamento {
    position: absolute;

    width: 135px;
    height: 135px;

    z-index: 4;

    opacity: .97;

    pointer-events: none;

    filter:
        drop-shadow(0 0 2px rgba(255,255,255,.12));

    transition:
        transform 1.05s cubic-bezier(.22,.61,.36,1),
        opacity .8s ease;
}

.canto-esquerdo-superior {
    top: 5px;
    left: 5px;
}

.canto-direito-superior {
    top: 5px;
    right: 5px;
    transform: scaleX(-1);
}

.canto-esquerdo-inferior {
    bottom: 5px;
    left: 5px;
    transform: scaleY(-1);
}

.canto-direito-inferior {
    bottom: 5px;
    right: 5px;
    transform: scale(-1);
}


/* =========================
   CONTEÚDO CENTRAL
========================= */

.conteudo {
    position: relative;

    z-index: 6;

    width: 88%;
    max-width: 700px;

    text-align: center;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    transform: translateY(-1%);

    transition:
        transform 1s cubic-bezier(.22,.61,.36,1),
        opacity .75s ease;
}


/* =========================
   NOME
========================= */

.nome {
    font-family: "Cormorant Garamond", Georgia, serif;

    font-size: clamp(39px, 10vw, 68px);

    font-weight: 400;

    line-height: .84;

    letter-spacing: .045em;

    color: #e9e9e7;

    text-shadow:
        0 1px 2px rgba(0,0,0,.7),
        0 0 14px rgba(210,215,220,.08);

    display: flex;
    flex-direction: column;

    align-items: center;

    white-space: nowrap;
}

.nome span {
    display: block;
}


/* =========================
   DIVISÓRIA
========================= */

.divisoria {
    width: min(430px, 67vw);

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 15px;

    margin-top: 25px;

    opacity: .9;
}

.divisoria::before,
.divisoria::after {
    content: "";

    height: 1px;

    flex: 1;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(215,216,215,.78)
        );
}

.divisoria::after {
    background:
        linear-gradient(
            90deg,
            rgba(215,216,215,.78),
            transparent
        );
}

.estrela {
    width: 10px;
    height: 10px;

    position: relative;

    transform: rotate(45deg);

    background:
        linear-gradient(
            135deg,
            #777b80,
            #ffffff,
            #85898e
        );

    box-shadow:
        0 0 7px rgba(220,220,220,.32);
}


/* =========================
   TEXTO CONVIDA
========================= */

.convite-frase {
    margin-top: 18px;

    font-family: "Cormorant Garamond", Georgia, serif;

    font-size: clamp(16px, 3.8vw, 21px);

    font-weight: 300;

    font-style: italic;

    letter-spacing: .08em;

    color: rgba(225,226,226,.78);

    text-shadow:
        0 1px 3px rgba(0,0,0,.6);
}


/* =========================
   15 ANOS
========================= */

.idade {
    margin-top: 9px;

    font-family: "Montserrat", Arial, sans-serif;

    font-size: clamp(11px, 2.4vw, 15px);

    font-weight: 300;

    letter-spacing: .62em;

    padding-left: .62em;

    color: rgba(225,226,226,.88);
}


/* =========================
   MONOGRAMA GV
========================= */

.monograma-area {
    position: relative;

    width: 215px;
    height: 180px;

    margin-top: 35px;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* letras GV */

.monograma {
    position: relative;

    font-family: "Cormorant Garamond", Georgia, serif;

    font-size: 137px;

    font-weight: 500;

    line-height: .7;

    letter-spacing: -.17em;

    padding-right: .17em;

    color: transparent;

    background:
        linear-gradient(
            125deg,
            #6d7176 0%,
            #f1f1ef 24%,
            #a5a8ab 43%,
            #ffffff 56%,
            #777b80 77%,
            #d5d6d6 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    filter:
        drop-shadow(0 3px 3px rgba(0,0,0,.75));
}


/* órbita */

.orbita {
    position: absolute;

    width: 190px;
    height: 62px;

    border:
        1px solid rgba(224,225,225,.78);

    border-radius: 50%;

    transform:
        rotate(-18deg)
        translateY(3px);

    pointer-events: none;
}

.orbita::after {
    content: "✦";

    position: absolute;

    right: 16px;
    top: -12px;

    font-size: 17px;

    color: #e8e8e6;

    text-shadow:
        0 0 8px rgba(255,255,255,.4);
}


/* detalhes laterais */

.monograma-area::before,
.monograma-area::after {
    content: "·";

    position: absolute;

    color: rgba(225,226,226,.55);

    font-size: 20px;
}

.monograma-area::before {
    left: 3px;
}

.monograma-area::after {
    right: 3px;
}


/* =========================
   TOQUE PARA ABRIR
========================= */

.abrir {
    position: absolute;

    bottom: 50px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 8;

    display: flex;
    flex-direction: column;

    align-items: center;

    color: rgba(225,226,226,.86);

    font-family: "Montserrat", Arial, sans-serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: .38em;

    padding-left: .38em;

    white-space: nowrap;

    animation:
        aparecer 1.2s ease both,
        respirar 2.8s ease-in-out infinite 1.2s;

    transition:
        opacity .45s ease,
        transform .7s cubic-bezier(.22,.61,.36,1);
}


/* =========================
   ABERTURA
========================= */

.capa.aberta .conteudo {
    transform:
        translateY(-1%)
        scale(.94);

    opacity: 0;
}

.capa.aberta .abrir {
    opacity: 0;

    transform:
        translateX(-50%)
        translateY(15px);
}

.capa.aberta .moldura {
    transform: scale(1.035);

    opacity: 0;
}


/* local se afasta junto */

.capa.aberta .local-festa {
    transform:
        translate(35px, 25px)
        scale(1.06);

    opacity: 0;
}


/* cantos se afastam */

.capa.aberta .canto-esquerdo-superior {
    transform:
        translate(-42px,-42px);
}

.capa.aberta .canto-direito-superior {
    transform:
        scaleX(-1)
        translate(-42px,-42px);
}

.capa.aberta .canto-esquerdo-inferior {
    transform:
        scaleY(-1)
        translate(-42px,-42px);
}

.capa.aberta .canto-direito-inferior {
    transform:
        scale(-1)
        translate(-42px,-42px);
}


/* linhas */

.capa.aberta .linha-superior {
    transform: translateY(-18px);
    opacity: 0;
}

.capa.aberta .linha-inferior {
    transform: translateY(18px);
    opacity: 0;
}


/* brilho central */

.capa::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: rgba(255,255,255,.9);

    box-shadow:
        0 0 35px 12px rgba(220,225,230,.16);

    opacity: 0;

    transform:
        translate(-50%,-50%)
        scale(.2);

    pointer-events: none;

    z-index: 20;
}

.capa.aberta::after {
    animation:
        brilhoAbertura .9s ease-out forwards;
}


/* =========================
   ANIMAÇÕES
========================= */

@keyframes brilhoAbertura {

    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    35% {
        opacity: .75;

        transform:
            translate(-50%,-50%)
            scale(3);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(18);
    }
}


@keyframes aparecer {

    from {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(8px);
    }

    to {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


@keyframes respirar {

    0%,
    100% {
        opacity: .72;
    }

    50% {
        opacity: 1;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .moldura {
        inset: 17px;
    }

    .linha-superior {
        top: 17px;
    }

    .linha-inferior {
        bottom: 17px;
    }


    .ornamento {
        width: 112px;
        height: 112px;
    }

    .canto-esquerdo-superior,
    .canto-direito-superior {
        top: 3px;
    }

    .canto-esquerdo-inferior,
    .canto-direito-inferior {
        bottom: 3px;
    }

    .canto-esquerdo-superior,
    .canto-esquerdo-inferior {
        left: 3px;
    }

    .canto-direito-superior,
    .canto-direito-inferior {
        right: 3px;
    }


    .nome {
        font-size: clamp(36px, 10.5vw, 54px);

        line-height: .86;

        letter-spacing: .035em;
    }


    .divisoria {
        margin-top: 21px;
    }


    .convite-frase {
        margin-top: 16px;

        font-size: 17px;

        letter-spacing: .055em;
    }


    .idade {
        margin-top: 8px;

        font-size: 10px;

        letter-spacing: .55em;

        padding-left: .55em;
    }


    .monograma-area {
        width: 190px;
        height: 165px;

        margin-top: 31px;
    }


    .monograma {
        font-size: 123px;
    }


    .orbita {
        width: 174px;
        height: 57px;
    }


    .local-festa {
        width: 92vw;

        right: -24%;

        bottom: 1%;

        opacity: .12;
    }


    .abrir {
        bottom: 42px;

        font-size: 9px;

        letter-spacing: .32em;

        padding-left: .32em;
    }
}


/* =========================
   TELAS BAIXAS
========================= */

@media (max-height: 700px) {

    .monograma-area {
        margin-top: 25px;
    }

    .convite-frase {
        margin-top: 12px;
    }

    .abrir {
        bottom: 28px;
    }
}

</style>

<script>

const capa = document.getElementById("capa");

let abrindo = false;

function abrirConvite() {

    if (abrindo) return;

    abrindo = true;

    capa.classList.add("aberta");

    /*
       Aqui futuramente entraremos
       na próxima tela do convite.
    */

    setTimeout(() => {

        abrindo = false;

    }, 1100);

}


/* funciona no celular e no computador */

capa.addEventListener(
    "pointerup",
    abrirConvite
);

</script>
