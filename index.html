<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gabriella Victória — 15 Anos</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        overflow: hidden;
        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(31, 45, 70, 0.30) 0%,
                rgba(10, 17, 29, 0.12) 34%,
                rgba(3, 7, 13, 0) 65%
            ),
            #050914;

        font-family: Georgia, "Times New Roman", serif;
        color: #e7e8e9;
    }

    .capa {
        position: relative;
        width: 100%;
        height: 100svh;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,0.018) 0%,
                transparent 35%,
                rgba(255,255,255,0.012) 70%,
                transparent 100%
            );
    }

    /*
        Textura extremamente sutil,
        para o fundo não parecer um azul chapado.
    */
    .capa::before {
        content: "";
        position: absolute;
        inset: 0;

        opacity: 0.18;

        background-image:
            radial-gradient(
                rgba(255,255,255,0.12) 0.5px,
                transparent 0.6px
            );

        background-size: 4px 4px;

        pointer-events: none;
    }

    /*
        Pequena iluminação central.
        Nada de moldura ou elementos decorativos.
    */
    .capa::after {
        content: "";
        position: absolute;

        width: min(70vw, 520px);
        height: min(70vw, 520px);

        border-radius: 50%;

        background: rgba(115, 135, 165, 0.035);
        filter: blur(80px);

        pointer-events: none;
    }

    .conteudo {
        position: relative;
        z-index: 2;

        width: min(88vw, 700px);

        text-align: center;

        display: flex;
        flex-direction: column;
        align-items: center;

        transition:
            opacity 0.7s ease,
            transform 0.9s cubic-bezier(.22,.61,.36,1);
    }

    .nome {
        font-family:
            "Times New Roman",
            Georgia,
            serif;

        font-size: clamp(27px, 6vw, 54px);

        font-weight: 400;

        letter-spacing: 0.18em;

        line-height: 1.15;

        white-space: nowrap;

        background:
            linear-gradient(
                105deg,
                #85898d 0%,
                #f4f4f2 18%,
                #b8babe 36%,
                #ffffff 50%,
                #999da2 67%,
                #e7e7e5 83%,
                #777b80 100%
            );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;

        filter:
            drop-shadow(0 1px 1px rgba(0,0,0,0.5));
    }

    .idade {
        margin-top: 20px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size: clamp(10px, 2.2vw, 14px);

        font-weight: 400;

        letter-spacing: 0.55em;

        padding-left: 0.55em;

        color: rgba(214, 216, 219, 0.78);

        text-transform: uppercase;
    }

    .monograma {
        margin-top: 58px;

        font-family:
            "Times New Roman",
            Georgia,
            serif;

        font-size: clamp(70px, 17vw, 150px);

        font-weight: 400;

        line-height: 0.8;

        letter-spacing: -0.08em;

        background:
            linear-gradient(
                115deg,
                #73777c 0%,
                #e8e9e8 25%,
                #8e9297 47%,
                #f1f1ef 58%,
                #73777c 82%,
                #bfc1c3 100%
            );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;

        opacity: 0.92;

        filter:
            drop-shadow(
                0 2px 3px rgba(0,0,0,0.65)
            );
    }

    /*
        Pequena indicação visual de que a capa é clicável,
        sem adicionar texto ou botão.
    */
    .capa:active .conteudo {
        transform: scale(0.985);
    }

    /*
        Animação de saída.
    */
    .capa.abrindo .conteudo {
        opacity: 0;
        transform: scale(1.025);
    }

    .capa.abrindo {
        pointer-events: none;
    }

    @media (max-width: 480px) {

        .nome {
            font-size: 25px;
            letter-spacing: 0.13em;
        }

        .idade {
            margin-top: 17px;
            font-size: 9px;
            letter-spacing: 0.48em;
        }

        .monograma {
            margin-top: 48px;
            font-size: 86px;
        }
    }
</style>
</head>

<body>

<div class="capa" id="capa">

    <div class="conteudo">

        <div class="nome">
            GABRIELLA VICTÓRIA
        </div>

        <div class="idade">
            15 ANOS
        </div>

        <div class="monograma">
            GV
        </div>

    </div>

</div>

<script>
    const capa = document.getElementById("capa");

    capa.addEventListener("click", () => {
        capa.classList.add("abrindo");

        /*
            Aqui vamos colocar a abertura
            para as próximas páginas do convite.
        */
    });
</script>

</body>
</html>
