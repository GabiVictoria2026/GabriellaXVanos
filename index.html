<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gabriella Victória — 15 anos</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 42%,
        #17233d 0%,
        #0d1629 32%,
        #070d19 68%,
        #03060d 100%);

    font-family: "Montserrat", sans-serif;
}

/* ÁREA PRINCIPAL */

.cena {
    width: min(92vw, 430px);
    height: min(88vh, 700px);

    display: flex;
    align-items: center;
    justify-content: center;

    perspective: 1800px;
}

/* ENVELOPE */

.envelope {
    position: relative;

    width: min(86vw, 390px);
    aspect-ratio: 0.72;

    transform-style: preserve-3d;

    filter:
        drop-shadow(0 35px 35px rgba(0,0,0,.55))
        drop-shadow(0 8px 14px rgba(0,0,0,.45));

    transition:
        transform 1.4s cubic-bezier(.2,.75,.2,1);
}

/* PAPEL */

.corpo {
    position: absolute;
    inset: 0;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #17243d 0%,
            #0d172b 46%,
            #101c31 100%
        );

    border: 1px solid rgba(190,196,208,.48);

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.035),
        inset 0 0 55px rgba(0,0,0,.32);
}

/* textura extremamente sutil */

.corpo::before {
    content: "";
    position: absolute;
    inset: 0;

    opacity: .16;

    background-image:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 4px
        );

    pointer-events: none;
}

/* MOLDURA INTERNA */

.moldura {
    position: absolute;
    inset: 17px;

    border: 1px solid rgba(196,200,210,.35);

    box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.18);

    pointer-events: none;
}

.moldura::after {
    content: "";

    position: absolute;
    inset: 8px;

    border: 1px solid rgba(190,196,208,.08);
}

/* DOBRAS LATERAIS */

.dobra-esquerda,
.dobra-direita,
.dobra-inferior {
    position: absolute;

    z-index: 3;

    pointer-events: none;
}

.dobra-esquerda {
    inset: 0 auto 0 0;
    width: 50%;

    clip-path: polygon(0 0, 100% 50%, 0 100%);

    background:
        linear-gradient(
            135deg,
            #17243d,
            #0a1324
        );

    border-right: 1px solid rgba(190,196,208,.16);
}

.dobra-direita {
    inset: 0 0 0 auto;
    width: 50%;

    clip-path: polygon(100% 0, 0 50%, 100% 100%);

    background:
        linear-gradient(
            225deg,
            #17243d,
            #0a1324
        );

    border-left: 1px solid rgba(190,196,208,.16);
}

.dobra-inferior {
    left: 0;
    right: 0;
    bottom: 0;

    height: 50%;

    clip-path: polygon(0 100%, 50% 0, 100% 100%);

    background:
        linear-gradient(
            180deg,
            #111d32,
            #081120
        );

    border-top: 1px solid rgba(190,196,208,.15);
}

/* ABA SUPERIOR */

.aba {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 55%;

    z-index: 8;

    transform-origin: top center;

    clip-path: polygon(0 0, 100% 0, 50% 100%);

    background:
        linear-gradient(
            180deg,
            #1a2944 0%,
            #101d33 58%,
            #0b1526 100%
        );

    border-bottom: 1px solid rgba(210,214,222,.34);

    box-shadow:
        inset 0 -18px 35px rgba(0,0,0,.18);

    transition:
        transform 1.55s cubic-bezier(.16,.76,.2,1),
        opacity 1.1s ease;
}

/* brilho muito discreto na dobra */

.aba::after {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;
    top: 12%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(210,214,222,.25),
            transparent
        );
}

/* SELO */

.lacre {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 112px;
    height: 112px;

    z-index: 20;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f1f2f4 0%,
            #c6c9cf 28%,
            #858b96 58%,
            #565d68 100%
        );

    border: 2px solid rgba(235,237,241,.85);

    box-shadow:
        0 9px 18px rgba(0,0,0,.5),
        inset 0 2px 4px rgba(255,255,255,.8),
        inset 0 -5px 8px rgba(0,0,0,.35);

    transition:
        transform .7s cubic-bezier(.2,.8,.2,1),
        opacity .55s ease,
        filter .4s ease;
}

.lacre::before {
    content: "";

    position: absolute;

    inset: 8px;

    border-radius: 50%;

    border: 1px solid rgba(30,37,48,.55);

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.25);
}

.lacre::after {
    content: "";

    position: absolute;

    inset: 15px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.38);
}

/* MONOGRAMA */

.gv {
    position: relative;

    z-index: 2;

    color: #202735;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 46px;
    font-weight: 500;

    letter-spacing: -7px;

    transform: translateX(-2px);

    text-shadow:
        0 1px 0 rgba(255,255,255,.55);
}

.gv span {
    position: relative;
    z-index: 1;
}

/* PEQUENO TEXTO DE APOIO */

.hint {
    position: absolute;

    bottom: -54px;
    left: 50%;

    transform: translateX(-50%);

    width: max-content;

    color: rgba(220,223,229,.52);

    font-size: 9px;
    font-weight: 400;

    letter-spacing: 4px;
    text-transform: uppercase;

    opacity: .8;
}

/* HOVER */

.lacre:hover {
    transform:
        translate(-50%, -50%)
        scale(1.045);

    filter:
        brightness(1.08);
}

/* ABERTURA */

.envelope.aberto .aba {
    transform:
        rotateX(-168deg);

    opacity: .08;
}

.envelope.aberto .lacre {
    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, -50%)
        scale(.65);
}

.envelope.aberto {
    transform:
        translateY(5px);
}

/* RESPONSIVO PARA TELAS PEQUENAS */

@media (max-height: 650px) {
    .cena {
        height: 92vh;
    }

    .envelope {
        width: min(84vw, 350px);
    }

    .lacre {
        width: 98px;
        height: 98px;
    }

    .gv {
        font-size: 41px;
    }
}

/* TELAS MUITO PEQUENAS */

@media (max-width: 360px) {
    .envelope {
        width: 88vw;
    }

    .lacre {
        width: 94px;
        height: 94px;
    }

    .gv {
        font-size: 39px;
    }
}
</style>
</head>

<body>

<div class="cena">

    <div class="envelope" id="envelope">

        <div class="corpo">

            <div class="moldura"></div>

            <div class="dobra-esquerda"></div>
            <div class="dobra-direita"></div>
            <div class="dobra-inferior"></div>

        </div>

        <div class="aba"></div>

        <button
            class="lacre"
            id="lacre"
            aria-label="Abrir convite"
        >
            <div class="gv">
                <span>G</span><span>V</span>
            </div>
        </button>

        <div class="hint">
            toque para abrir
        </div>

    </div>

</div>

<script>

const envelope = document.getElementById("envelope");
const lacre = document.getElementById("lacre");

function abrirEnvelope() {
    envelope.classList.add("aberto");
}

lacre.addEventListener("click", abrirEnvelope);

lacre.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" ||
        event.key === " "
    ) {
        event.preventDefault();
        abrirEnvelope();
    }

});

</script>

</body>
</html>
