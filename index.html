/* =========================================================
   BASE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #02050a;
    color: #eeeeec;
}


/* =========================================================
   CAPA
========================================================= */

.capa {

    position: relative;

    width: 100%;
    height: 100vh;
    height: 100svh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    background: #02050a;
}


/* =========================================================
   FUNDO — CAMADA 0
========================================================= */

.fundo {

    position: absolute;

    inset: 0;

    z-index: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 43%,
            rgba(27, 38, 54, 0.30) 0%,
            rgba(10, 17, 28, 0.18) 32%,
            rgba(3, 7, 13, 0.55) 70%,
            #02050a 100%
        );

}


/* =========================================================
   TEXTURA — CAMADA 1
========================================================= */

.textura {

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    opacity: 0.035;

    background-image:
        radial-gradient(
            rgba(255,255,255,0.65) 0.35px,
            transparent 0.6px
        );

    background-size: 5px 5px;
}


/* =========================================================
   FOTO DO TROPICAL — CAMADA 2
========================================================= */

.local-festa {

    position: absolute;

    z-index: 2;

    width: min(560px, 82vw);

    right: -9%;
    bottom: -2%;

    opacity: 0.055;

    pointer-events: none;

    transition:
        opacity 0.8s ease,
        transform 1.2s cubic-bezier(.22,.61,.36,1);
}

.local-festa img {

    display: block;

    width: 100%;
    height: auto;

    filter:
        grayscale(1)
        brightness(0.55)
        contrast(0.55);

    opacity: 0.8;
}


/* =========================================================
   LINHAS LATERAIS — CAMADA 4
========================================================= */

.borda-lateral {

    position: absolute;

    top: 12%;
    bottom: 12%;

    width: 1px;

    z-index: 4;

    pointer-events: none;

    opacity: 0.48;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(225,226,225,.08) 10%,
            rgba(225,226,225,.38) 28%,
            rgba(245,245,243,.58) 50%,

            transparent 100%
        );

    filter:
        drop-shadow(
            0 0 5px rgba(235,235,235,.16)
        );

    transition:
        opacity .7s ease,
        transform 1s cubic-bezier(.22,.61,.36,1);
}

.borda-esquerda {
    left: 18px;
}

.borda-direita {
    right: 18px;
}

.borda-lateral::before,
.borda-lateral::after {

    content: "";

    position: absolute;

    left: 50%;

    width: 18px;
    height: 1px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(235,235,233,.65),
            transparent
        );
}

.borda-lateral::before {
    top: 9%;
}

.borda-lateral::after {
    bottom: 9%;
}

    content: "✦";

    left: 50%;

    transform: translateX(-50%);

    bottom: -17px;

    font-family: Georgia, serif;

    font-size: 6px;

    color: rgba(230,231,230,.48);
}

    flex-direction: column;

    white-space: nowrap;

.nome span {
    display: block;
