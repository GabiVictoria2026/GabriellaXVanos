<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gabriella Victória — 15 Anos</title>

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            rgba(22, 36, 57, 0.35) 0%,
            rgba(7, 14, 25, 0.15) 42%,
            rgba(2, 7, 14, 0) 75%
        ),
        #030811;

    color: #eeeeec;
}


/* =========================================
   CAPA
========================================= */

.capa {

    position: relative;

    width: 100%;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.018),
            transparent 35%,
            rgba(255,255,255,0.008)
        );
}


/* textura extremamente discreta */

.capa::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: 0.14;

    background-image:
        radial-gradient(
            rgba(255,255,255,0.16) 0.45px,
            transparent 0.55px
        );

    background-size: 4px 4px;

    pointer-events: none;
}


/* =========================================
   MOLDURA
========================================= */

.moldura {

    position: absolute;

    inset: 22px;

    border: 1px solid rgba(205, 207, 208, 0.55);

    pointer-events: none;

    z-index: 1;
}


/* linhas superiores e inferiores */

.linha-horizontal {

    position: absolute;

    left: 7%;
    right: 7%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(220,220,218,0.75),
            transparent
        );

    opacity: 0.75;
}

.linha-superior {
    top: 22px;
}

.linha-inferior {
    bottom: 22px;
}


/* =========================================
   ORNAMENTOS
========================================= */

.ornamento {

    position: absolute;

    width: 125px;
    height: 125px;

    z-index: 3;

    opacity: 0.95;

    pointer-events: none;
}


/* cantos */

.canto-esquerdo-superior {
    top: 10px;
    left: 10px;
}

.canto-direito-superior {
    top: 10px;
    right: 10px;

    transform: scaleX(-1);
}

.canto-esquerdo-inferior {
    bottom: 10px;
    left: 10px;

    transform: scaleY(-1);
}

.canto-direito-inferior {
    bottom: 10px;
    right: 10px;

    transform: scale(-1);
}


/* =========================================
   CONTEÚDO CENTRAL
========================================= */

.conteudo {

    position: relative;

    z-index: 5;

    width: 88%;

    max-width: 700px;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transform: translateY(-1%);

    transition:
        transform 0.5s ease,
        opacity 0.7s ease;
}


/* =========================================
   NOME
========================================= */

.nome {

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: clamp(42px, 8vw, 72px);

    font-weight: 400;

    line-height: 0.92;

    letter-spacing: 0.055em;

    color: #e7e7e5;

    text-shadow:
        0 1px 2px rgba(0,0,0,0.65),
        0 0 14px rgba(210,215,220,0.08);

    white-space: nowrap;
}


/* =========================================
   DIVISÓRIA
========================================= */

.divisoria {

    width: min(430px, 67vw);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;

    margin-top: 24px;

    opacity: 0.85;
}

.divisoria::before,
.divisoria::after {

    content: "";

    height: 1px;

    flex: 1;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(215,216,215,0.75)
        );
}

.divisoria::after {

    background:
        linear-gradient(
            90deg,
            rgba(215,216,215,0.75),
            transparent
        );
}


.estrela {

    width: 11px;
    height: 11px;

    position: relative;

    transform: rotate(45deg);

    background: linear-gradient(
        135deg,
        #777b80,
        #ffffff,
        #85898e
    );

    box-shadow:
        0 0 7px rgba(220,220,220,0.3);
}


/* =========================================
   15 ANOS
========================================= */

.idade {

    margin-top: 18px;

    font-family:
        "Montserrat",
        Arial,
        sans-serif;

    font-size: clamp(11px, 2.4vw, 15px);

    font-weight: 300;

    letter-spacing: 0.62em;

    padding-left: 0.62em;

    color: rgba(225,226,226,0.84);
}


/* =========================================
   MONOGRAMA GV
========================================= */

.monograma-area {

    position: relative;

    width: 210px;
    height: 180px;

    margin-top: 43px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.monograma {

    position: relative;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 145px;

    font-weight: 500;

    line-height: 0.75;

    letter-spacing: -0.18em;

    color: transparent;

    background:
        linear-gradient(
            125deg,
            #6d7176 0%,
            #f1f1ef 24%,
            #a5a8ab 43%,
            #ffffff 56%,
            #777b80 77%,
            #d5d6d6 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    filter:
        drop-shadow(
            0 3px 3px rgba(0,0,0,0.75)
        );
}


/* círculo/órbita do GV */

.orbita {

    position: absolute;

    width: 190px;
    height: 62px;

    border: 1px solid rgba(224,225,225,0.75);

    border-radius: 50%;

    transform:
        rotate(-18deg)
        translateY(3px);

    pointer-events: none;
}


.orbita::after {

    content: "✦";

    position: absolute;

    right: 18px;
    top: -12px;

    font-size: 17px;

    color: #e8e8e6;

    text-shadow:
        0 0 8px rgba(255,255,255,0.4);
}


/* =========================================
   TOQUE PARA ABRIR
========================================= */

.abrir {

    position: absolute;

    bottom: 52px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 8;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 13px;

    color: rgba(225,226,226,0.82);

    font-family:
        "Montserrat",
        Arial,
        sans-serif;

    font-size: 10px;

    font-weight: 300;

    letter-spacing: 0.38em;

    white-space: nowrap;

    padding-left: 0.38em;
}


/* ícone de toque */

.icone-toque {

    width: 45px;
    height: 45px;

    border: 1px solid rgba(225,226,226,0.75);

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;

    animation:
        pulsar 2.2s ease-in-out infinite;
}


/* dedo estilizado */

.icone-toque::before {

    content: "♧";

    font-size: 22px;

    transform: rotate(180deg);

    color: rgba(235,235,233,0.9);
}


/* brilho externo */

.icone-toque::after {

    content: "";

    position: absolute;

    inset: -7px;

    border-radius: 50%;

    border: 1px solid rgba(220,220,220,0.12);

    animation:
        onda 2.2s ease-out infinite;
}


@keyframes pulsar {

    0%,
    100% {
        transform: scale(1);
        opacity: 0.78;
    }

    50% {
        transform: scale(1.06);
        opacity: 1;
    }
}


@keyframes onda {

    0% {
        transform: scale(0.9);
        opacity: 0.4;
    }

    100% {
        transform: scale(1.35);
        opacity: 0;
    }
}


/* =========================================
   EFEITO AO TOCAR
========================================= */

.capa.tocada .conteudo {

    transform: scale(0.985);

    opacity: 0.92;
}

.capa.tocada .abrir {

    transform:
        translateX(-50%)
        scale(0.94);

    opacity: 0.55;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}


/* =========================================
   CELULARES
========================================= */

@media (max-width: 600px) {

    .moldura {
        inset: 17px;
    }

    .linha-superior {
        top: 17px;
    }

    .linha-inferior {
        bottom: 17px;
    }

    .ornamento {
        width: 100px;
        height: 100px;
    }

    .canto-esquerdo-superior,
    .canto-direito-superior {
        top: 7px;
    }

    .canto-esquerdo-inferior,
    .canto-direito-inferior {
        bottom: 7px;
    }

    .canto-esquerdo-superior,
    .canto-esquerdo-inferior {
        left: 7px;
    }

    .canto-direito-superior,
    .canto-direito-inferior {
        right: 7px;
    }

    .nome {

        font-size: clamp(
            35px,
            9.2vw,
            54px
        );

        letter-spacing: 0.045em;

        line-height: 0.95;
    }

    .divisoria {
        margin-top: 21px;
    }

    .idade {

        margin-top: 16px;

        font-size: 10px;

        letter-spacing: 0.55em;
    }

    .monograma-area {

        width: 190px;
        height: 165px;

        margin-top: 38px;
    }

    .monograma {
        font-size: 128px;
    }

    .orbita {
        width: 175px;
        height: 58px;
    }

    .abrir {

        bottom: 43px;

        font-size: 9px;

        letter-spacing: 0.32em;

        padding-left: 0.32em;
    }

    .icone-toque {
        width: 42px;
        height: 42px;
    }
}


/* =========================================
   CELULARES MUITO PEQUENOS
========================================= */

@media (max-height: 700px) {

    .monograma-area {
        margin-top: 27px;
    }

    .abrir {
        bottom: 28px;
    }
}

</style>
</head>

<script>

const capa = document.getElementById("capa");

const abrir = document.getElementById("abrir");


function tocarCapa() {

    capa.classList.add("tocada");

    setTimeout(() => {

        capa.classList.remove("tocada");

    }, 350);

}


/* Clique na capa */

capa.addEventListener("click", tocarCapa);


/* Clique especificamente no botão */

abrir.addEventListener("click", function(event) {

    event.stopPropagation();

    tocarCapa();

});

</script>
