<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriella Victória — 15 Anos</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      #18233b 0%,
      #0b1221 45%,
      #050914 100%
    );
  font-family: "Cormorant Garamond", serif;
}

/* =========================
   CENA
========================= */

.cena {
  width: 100%;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;
  overflow: hidden;

  perspective: 2000px;
}

/* =========================
   ENVELOPE
========================= */

.envelope {
  position: relative;

  width: min(94vw, 520px);
  aspect-ratio: 0.70;

  transform-style: preserve-3d;

  filter:
    drop-shadow(0 35px 35px rgba(0,0,0,.55))
    drop-shadow(0 12px 18px rgba(0,0,0,.35));
}

/* =========================
   CORPO
========================= */

.corpo {
  position: absolute;
  inset: 0;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #111d35 0%,
      #0b162c 42%,
      #071126 100%
    );

  border: 1px solid rgba(203, 211, 225, .32);

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.04),
    inset 0 0 35px rgba(0,0,0,.55),
    inset 12px 0 30px rgba(255,255,255,.025),
    inset -12px 0 30px rgba(0,0,0,.25);

  transform-style: preserve-3d;
}

/* textura muito discreta */
.corpo::before {
  content: "";
  position: absolute;
  inset: 0;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.012) 0px,
      rgba(255,255,255,.012) 1px,
      transparent 1px,
      transparent 4px
    );

  opacity: .35;
  pointer-events: none;
}

/* brilho suave na parte superior */
.corpo::after {
  content: "";
  position: absolute;

  top: -20%;
  left: -20%;

  width: 140%;
  height: 70%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.055),
      transparent 65%
    );

  pointer-events: none;
}

/* =========================
   MOLDURA
========================= */

.moldura {
  position: absolute;
  inset: 20px;

  border: 1px solid rgba(190,198,215,.25);

  box-shadow:
    inset 0 0 15px rgba(0,0,0,.25);

  pointer-events: none;
}

/* =========================
   DOBRAS
========================= */

.dobra-esquerda {
  position: absolute;
  left: 0;
  bottom: 0;

  width: 53%;
  height: 52%;

  background:
    linear-gradient(
      145deg,
      rgba(27,43,70,.85),
      rgba(6,15,31,.92)
    );

  clip-path: polygon(
    0 0,
    100% 100%,
    0 100%
  );

  border-right: 1px solid rgba(190,198,215,.12);
}

.dobra-direita {
  position: absolute;
  right: 0;
  bottom: 0;

  width: 53%;
  height: 52%;

  background:
    linear-gradient(
      215deg,
      rgba(24,40,66,.82),
      rgba(5,13,29,.94)
    );

  clip-path: polygon(
    100% 0,
    100% 100%,
    0 100%
  );

  border-left: 1px solid rgba(190,198,215,.10);
}

.dobra-inferior {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 54%;

  background:
    linear-gradient(
      to bottom,
      rgba(19,34,58,.96),
      rgba(5,13,28,.98)
    );

  clip-path: polygon(
    0 100%,
    50% 0,
    100% 100%
  );

  border-top: 1px solid rgba(190,198,215,.10);

  pointer-events: none;
}

/* =========================
   ABA SUPERIOR
========================= */

.aba {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 56%;

  transform-origin: 50% 0%;
  transform-style: preserve-3d;

  transition:
    transform 1.25s cubic-bezier(.22,.7,.25,1);

  z-index: 20;
}

/* frente da aba */
.aba-frente {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      150deg,
      #182844 0%,
      #0c1930 45%,
      #071125 100%
    );

  clip-path: polygon(
    0 0,
    100% 0,
    50% 100%
  );

  border-left: 1px solid rgba(204,211,224,.18);
  border-right: 1px solid rgba(204,211,224,.18);

  box-shadow:
    inset 0 -20px 35px rgba(0,0,0,.28);
}

/* sombra da dobra */
.aba-frente::after {
  content: "";

  position: absolute;
  left: 7%;
  right: 7%;
  bottom: 6%;

  height: 18%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.35),
      transparent 70%
    );

  filter: blur(8px);
}

/* =========================
   LACRE
========================= */

.lacre {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 72px;
  height: 72px;

  transform:
    translate(-50%, -50%)
    translateZ(30px);

  border-radius: 50%;

  cursor: pointer;

  z-index: 40;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 32% 27%,
      #ffffff 0%,
      #dce1e8 12%,
      #929ba9 35%,
      #eef1f5 54%,
      #727c8c 78%,
      #d5dae1 100%
    );

  border: 2px solid rgba(242,245,249,.75);

  box-shadow:
    0 8px 14px rgba(0,0,0,.45),
    0 2px 3px rgba(0,0,0,.55),
    inset 0 2px 2px rgba(255,255,255,.75),
    inset 0 -4px 7px rgba(0,0,0,.32);

  transition:
    transform .25s ease,
    filter .25s ease;
}

.lacre::before {
  content: "";

  position: absolute;
  inset: 6px;

  border-radius: 50%;

  border: 1px solid rgba(50,59,72,.55);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35);
}

.lacre::after {
  content: "";

  position: absolute;

  top: 10px;
  left: 16px;

  width: 25px;
  height: 9px;

  border-radius: 50%;

  background: rgba(255,255,255,.42);

  filter: blur(3px);

  transform: rotate(-20deg);
}

.lacre:hover {
  filter: brightness(1.08);
  transform:
    translate(-50%, -50%)
    translateZ(30px)
    scale(1.04);
}

.gv {
  position: relative;
  z-index: 2;

  color: #273140;

  font-size: 27px;
  font-weight: 600;

  letter-spacing: -4px;

  transform: translateX(-1px);

  text-shadow:
    0 1px 0 rgba(255,255,255,.7),
    0 -1px 0 rgba(0,0,0,.35);
}

/* =========================
   ABERTURA
========================= */

.envelope.aberto .aba {
  transform: rotateX(-168deg);
}

.envelope.aberto .lacre {
  pointer-events: none;
  opacity: 0;
  transition:
    opacity .35s ease,
    transform .35s ease;
}

/* =========================
   RESPONSIVO
========================= */

@media (max-width: 600px) {

  .envelope {
    width: min(94vw, 500px);
  }

  .moldura {
    inset: 16px;
  }

  .lacre {
    width: 68px;
    height: 68px;
  }

  .gv {
    font-size: 25px;
  }
}

@media (max-height: 700px) {

  .envelope {
    width: min(78vh, 500px);
  }
}
</style>
</head>

<body>

<div class="cena">

  <div class="envelope" id="envelope">

    <div class="corpo">

      <div class="moldura"></div>

      <div class="dobra-esquerda"></div>
      <div class="dobra-direita"></div>
      <div class="dobra-inferior"></div>

    </div>

    <div class="aba">
      <div class="aba-frente"></div>
    </div>

    <button class="lacre" id="lacre" aria-label="Abrir convite">
      <span class="gv">GV</span>
    </button>

  </div>

</div>

<script>
const envelope = document.getElementById("envelope");
const lacre = document.getElementById("lacre");

function abrirConvite() {
  if (!envelope.classList.contains("aberto")) {
    envelope.classList.add("aberto");
  }
}

lacre.addEventListener("click", abrirConvite);

lacre.addEventListener("keydown", function(event) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    abrirConvite();
  }
});
</script>

</body>
</html>
