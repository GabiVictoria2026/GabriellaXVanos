* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #020711;
    color: #eeeeec;
}


/* =========================================================
   CAPA
========================================================= */

.capa {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(34, 51, 76, .40) 0%,
            rgba(14, 27, 46, .25) 30%,
            rgba(5, 12, 22, .62) 68%,
            #020711 100%
        ),
        linear-gradient(
            145deg,
            #07111f,
            #020711 50%,
            #06101d
        );

    perspective: 1200px;
}


/* textura extremamente discreta */

.capa::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .13;

    background:
        radial-gradient(
            ellipse at 25% 20%,
            rgba(255,255,255,.08),
            transparent 40%
        ),
        radial-gradient(
            ellipse at 75% 80%,
            rgba(255,255,255,.05),
            transparent 42%
        );
}


/* granulação */

.capa::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .045;

    background-image:
        radial-gradient(
            rgba(255,255,255,.7) .3px,
            transparent .5px
        );

    background-size: 5px 5px;
}


/* =========================================================
   FOTO DO TROPICAL
   SEM MIX-BLEND
   SEM MASK
========================================================= */

.local-festa {

    position: absolute;

    z-index: 1;

    width: min(560px, 82vw);

    right: -9%;
    bottom: -2%;

    opacity: .075;

    pointer-events: none;

    transition:
        opacity .8s ease,
        transform 1.2s cubic-bezier(.22,.61,.36,1);
}


/* imagem neutra */

.local-festa img {

    display: block;

    width: 100%;
    height: auto;

    /*
       Preto e branco + pouca luminosidade.
       Não mistura com o fundo.
    */

    filter:
        grayscale(1)
        brightness(.72)
        contrast(.58);

    opacity: .75;
}


/*
   Escurece visualmente as bordas da própria área
   da imagem, sem alterar o fundo da página.
*/

.local-festa::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            transparent 20%,
            rgba(2,7,17,.35) 55%,
            rgba(2,7,17,.78) 82%,
            #020711 100%
        ),

        linear-gradient(
            to top,
            #020711 0%,
            rgba(2,7,17,.72) 18%,
            transparent 48%
        ),

        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(2,7,17,.25) 60%,
            #020711 95%
        );
}


/* =========================================================
   LINHAS LATERAIS
========================================================= */

.borda-lateral {

    position: absolute;

    top: 12%;
    bottom: 12%;

    width: 1px;

    z-index: 4;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(225,226,225,.08) 10%,
            rgba(225,226,225,.38) 28%,
            rgba(245,245,243,.58) 50%,
            rgba(225,226,225,.38) 72%,
            rgba(225,226,225,.08) 90%,
            transparent 100%
        );

    opacity: .48;

    filter:
        drop-shadow(
            0 0 5px rgba(235,235,235,.16)
        );

    transition:
        opacity .7s ease,
        transform 1s cubic-bezier(.22,.61,.36,1);
}

.borda-esquerda {
    left: 18px;
}

.borda-direita {
    right: 18px;
}


.borda-lateral::before,
.borda-lateral::after {

    content: "";

    position: absolute;

    left: 50%;

    width: 18px;
    height: 1px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(235,235,233,.65),
            transparent
        );
}

.borda-lateral::before {
    top: 9%;
}

.borda-lateral::after {
    bottom: 9%;
}
