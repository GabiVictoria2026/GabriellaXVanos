<title>Gabriella Victória — 15 Anos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =========================
   BASE
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #020711;
    color: #eeeeec;
}


/* =========================
   CAPA
========================= */

.capa {

    position: relative;

    width: 100%;
    height: 100svh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(32, 49, 74, .40) 0%,
            rgba(13, 25, 43, .25) 28%,
            rgba(5, 12, 22, .62) 65%,
            #020711 100%
        ),
        linear-gradient(
            145deg,
            #07111f,
            #020711 50%,
            #06101d
        );

    perspective: 1200px;
}


/* =========================
   TEXTURA
========================= */

.capa::before {

    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .16;

    background:
        radial-gradient(
            ellipse at 30% 20%,
            rgba(255,255,255,.08),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 75% 80%,
            rgba(255,255,255,.05),
            transparent 42%
        );

    mix-blend-mode: screen;
}


/* textura fina */

.capa::after {

    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .08;

    background-image:
        radial-gradient(
            rgba(255,255,255,.6) .35px,
            transparent .5px
        );

    background-size: 5px 5px;
}


/* =========================
   ILUSTRAÇÃO DO LOCAL
========================= */

.local-festa {

    position: absolute;

    z-index: 1;

    width: min(500px, 78vw);

    right: -7%;

    bottom: 1%;

    opacity: .075;

    filter:
        grayscale(1)
        brightness(1.75)
        contrast(.72);

    mix-blend-mode: screen;

    pointer-events: none;

    transition:
        opacity .8s ease,
        transform 1.2s cubic-bezier(.22,.61,.36,1);
}


/* =========================
   ORNAMENTOS
========================= */

.ornamento {

    position: absolute;

    width: 135px;
    height: 135px;

    z-index: 4;

    opacity: .92;

    pointer-events: none;

    filter:
        drop-shadow(
            0 0 2px rgba(255,255,255,.12)
        );

    transition:
        transform 1s cubic-bezier(.22,.61,.36,1),
        opacity .8s ease;
}


/* superior esquerdo */

.canto-esquerdo-superior {
    top: 8px;
    left: 7px;
}


/* superior direito */

.canto-direito-superior {

    top: 8px;
    right: 7px;

    transform: scaleX(-1);
}


/* inferior esquerdo */

.canto-esquerdo-inferior {

    bottom: 8px;
    left: 7px;

    transform: scaleY(-1);
}


/* inferior direito */

.canto-direito-inferior {

    bottom: 8px;
    right: 7px;

    transform: scale(-1);
}


/* =========================
   GV PEQUENO
========================= */

.logo-topo {

    position: absolute;

    top: 54px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 7;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 47px;

    font-weight: 500;

    line-height: .8;

    letter-spacing: -.14em;

    padding-right: .14em;

    color: transparent;

    background:
        linear-gradient(
            125deg,
            #74787d,
            #f1f1ef 30%,
            #a2a5a8 48%,
            #ffffff 58%,
            #777b80 80%,
            #d6d7d7
        );

    -webkit-background-clip: text;
    background-clip: text;

    filter:
        drop-shadow(
            0 2px 2px rgba(0,0,0,.7)
        );

    opacity: .88;

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.22,.61,.36,1);
}


/* pequeno detalhe abaixo do GV */

.logo-topo::after {

    content: "✦";

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    bottom: -18px;

    font-family: Georgia, serif;

    font-size: 7px;

    color: rgba(230,231,230,.58);
}


/* =========================
   CONTEÚDO PRINCIPAL
========================= */

.conteudo {

    position: relative;

    z-index: 6;

    width: 90%;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transform:
        translateY(4%);

    transition:
        opacity .7s ease,
        transform .9s cubic-bezier(.22,.61,.36,1);
}


/* =========================
   NOME
========================= */

.nome {

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(
            39px,
            9.7vw,
            64px
        );

    font-weight: 400;

    line-height: .84;

    letter-spacing: .045em;

    color: #eeeeec;

    text-shadow:
        0 1px 2px rgba(0,0,0,.75),
        0 0 14px rgba(220,225,230,.07);

    display: flex;

    flex-direction: column;

    align-items: center;

    white-space: nowrap;
}

.nome span {
    display: block;
}


/* =========================
   DETALHE
========================= */

.detalhe {

    width: 80px;

    height: 1px;

    margin-top: 23px;

    position: relative;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(220,221,220,.75),
            transparent
        );
}

.detalhe::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    background:
        linear-gradient(
            135deg,
            #8a8e93,
            #ffffff,
            #8b8f94
        );

    box-shadow:
        0 0 7px rgba(255,255,255,.25);
}


/* =========================
   CONVIDA VOCÊ
========================= */

.convite-frase {

    margin-top: 25px;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(
            20px,
            4.7vw,
            27px
        );

    font-weight: 300;

    font-style: italic;

    letter-spacing: .075em;

    color:
        rgba(231,232,231,.88);

    text-shadow:
        0 1px 3px rgba(0,0,0,.7);
}


/* =========================
   15 ANOS — DESTAQUE
========================= */

.idade {

    margin-top: 8px;

    font-family:
        "Montserrat",
        Arial,
        sans-serif;

    font-size:
        clamp(
            27px,
            7vw,
            44px
        );

    font-weight: 300;

    letter-spacing: .28em;

    padding-left: .28em;

    color: #f0f0ee;

    text-shadow:
        0 1px 3px rgba(0,0,0,.8),
        0 0 16px rgba(220,225,230,.10);
}


/* =========================
   PEQUENO DETALHE ABAIXO
========================= */

.detalhe-baixo {

    width: 46px;

    height: 1px;

    margin-top: 22px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(218,219,218,.55),
            transparent
        );

    opacity: .65;
}


/* =========================
   TOQUE PARA ABRIR
========================= */

.abrir {

    position: absolute;

    left: 50%;

    bottom: 74px;

    transform:
        translateX(-50%);

    z-index: 8;

    color:
        rgba(225,226,226,.62);

    font-family:
        "Montserrat",
        Arial,
        sans-serif;

    font-size: 9px;

    font-weight: 300;

    letter-spacing: .34em;

    padding-left: .34em;

    white-space: nowrap;

    animation:
        respirar 3s ease-in-out infinite;

    transition:
        opacity .45s ease,
        transform .7s cubic-bezier(.22,.61,.36,1);
}


/* =========================
   ABERTURA
========================= */

.capa.aberta .conteudo {

    opacity: 0;

    transform:
        translateY(4%)
        scale(.95);
}


.capa.aberta .logo-topo {

    opacity: 0;

    transform:
        translateX(-50%)
        translateY(-18px)
        scale(.8);
}


.capa.aberta .abrir {

    opacity: 0;

    transform:
        translateX(-50%)
        translateY(18px);
}


.capa.aberta .local-festa {

    opacity: 0;

    transform:
        translate(35px,25px)
        scale(1.05);
}


/* =========================
   ORNAMENTOS ABRINDO
========================= */

.capa.aberta .canto-esquerdo-superior {

    transform:
        translate(-40px,-40px);
}

.capa.aberta .canto-direito-superior {

    transform:
        scaleX(-1)
        translate(-40px,-40px);
}

.capa.aberta .canto-esquerdo-inferior {

    transform:
        scaleY(-1)
        translate(-40px,-40px);
}

.capa.aberta .canto-direito-inferior {

    transform:
        scale(-1)
        translate(-40px,-40px);
}


/* =========================
   BRILHO DE ABERTURA
========================= */

.capa.aberta::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 0 35px 12px
        rgba(220,225,230,.16);

    opacity: 0;

    transform:
        translate(-50%,-50%)
        scale(.2);

    pointer-events: none;

    z-index: 20;

    animation:
        brilhoAbertura .9s ease-out forwards;
}


/* =========================
   ANIMAÇÕES
========================= */

@keyframes brilhoAbertura {

    0% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    35% {

        opacity: .75;

        transform:
            translate(-50%,-50%)
            scale(3);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(18);
    }
}


@keyframes respirar {

    0%,
    100% {
        opacity: .50;
    }

    50% {
        opacity: .72;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .ornamento {

        width: 108px;
        height: 108px;
    }


    .canto-esquerdo-superior,
    .canto-direito-superior {

        top: 5px;
    }


    .canto-esquerdo-inferior,
    .canto-direito-inferior {

        bottom: 5px;
    }


    .logo-topo {

        top: 48px;

        font-size: 42px;
    }


    .conteudo {

        transform:
            translateY(3%);
    }


    .nome {

        font-size:
            clamp(
                35px,
                10vw,
                53px
            );

        letter-spacing: .035em;
    }


    .detalhe {

        margin-top: 20px;

        width: 72px;
    }


    .convite-frase {

        margin-top: 22px;

        font-size: 21px;

        letter-spacing: .055em;
    }


    .idade {

        margin-top: 7px;

        font-size: 31px;

        letter-spacing: .22em;

        padding-left: .22em;
    }


    .detalhe-baixo {

        margin-top: 18px;
    }


    .local-festa {

        width: 91vw;

        right: -28%;

        bottom: 0;

        opacity: .065;
    }


    .abrir {

        bottom: 70px;

        font-size: 8px;

        letter-spacing: .30em;

        padding-left: .30em;
    }
}


/* =========================
   TELAS BAIXAS
========================= */

@media (max-height: 700px) {

    .logo-topo {

        top: 36px;
    }


    .conteudo {

        transform:
            translateY(1%);
    }


    .convite-frase {

        margin-top: 17px;
    }


    .idade {

        font-size: 29px;
    }


    .abrir {

        bottom: 58px;
    }
}

</style>

<script>

const capa = document.getElementById("capa");

let abrindo = false;

function abrirConvite() {

    if (abrindo) return;

    abrindo = true;

    capa.classList.add("aberta");

    setTimeout(() => {

        abrindo = false;

    }, 1100);
}


/* clique e toque */

capa.addEventListener(
    "pointerup",
    abrirConvite
);

</script>
